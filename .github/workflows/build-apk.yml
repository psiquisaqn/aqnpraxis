name: 📱 Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🔧 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🏗️ Construir la versión estática (Next.js)
        run: |
          # Usar la configuración de exportación temporalmente
          cp next.config.export.js next.config.js
          npm run build
        # Después del build, no es necesario restaurar porque el runner se limpia

      - name: 🧩 Sincronizar con Capacitor
        run: npx cap sync android

      - name: ☕ Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔑 Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: 🛠️ Generar APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 📤 Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30