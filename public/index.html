<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AQN Praxis</title>
    <style>
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .loader {
        text-align: center;
      }
      .loader .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e0e0e0;
        border-top: 4px solid #2563eb;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .loader p {
        color: #666;
        font-size: 14px;
      }
    </style>
    <script>
      // Redirigir a la URL de producción en Vercel
      // Cambia esta URL por la de tu app en Vercel
      var APP_URL = 'https://aqnpraxis.vercel.app';
      
      // Si la app se abre dentro de la WebView de Capacitor,
      // podemos forzar la redirección
      if (window.location.href.indexOf('file://') === 0) {
        window.location.href = APP_URL;
      }
    </script>
  </head>
  <body>
    <div class="loader">
      <div class="spinner"></div>
      <p>Cargando AQN Praxis...</p>
    </div>
  </body>
</html>
